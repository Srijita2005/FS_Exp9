spring.application.name=RestApiExceptionHandling

# ─── H2 In-Memory Database ───────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:bookdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Defer schema creation until data.sql runs
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ─── H2 Console ──────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.example.RestApiExceptionHandling=INFO
logging.level.org.springframework.cache=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n