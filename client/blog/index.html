<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="A multi-user blogging platform with authentication, posts and comments"/>
  <title>Blog Platform — MERN Stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app-bg"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="nav-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span>BlogStack</span>
    </a>
    <div class="nav-links" id="nav-links">
      <a href="#" onclick="showView('feed')" class="nav-link">Feed</a>
      <span id="nav-auth-area"></span>
    </div>
  </nav>

  <main class="main-container">
    <!-- AUTH VIEW: Login / Register -->
    <div id="view-auth" class="view">
      <div class="auth-card">
        <h2 id="auth-title">Sign In</h2>
        <p class="auth-subtitle" id="auth-subtitle">Welcome back! Enter your details.</p>
        <form id="auth-form">
          <div class="form-group" id="fg-username" style="display:none">
            <label>Username</label>
            <input type="text" id="auth-username" placeholder="johndoe" autocomplete="username"/>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-password" placeholder="••••••" autocomplete="current-password"/>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="auth-submit">Sign In</button>
        </form>
        <p class="auth-toggle">
          <span id="auth-toggle-text">Don't have an account?</span>
          <a href="#" id="auth-toggle-link" onclick="toggleAuthMode(event)">Sign Up</a>
        </p>
      </div>
    </div>

    <!-- FEED VIEW: List of posts -->
    <div id="view-feed" class="view" style="display:none">
      <div class="feed-header">
        <div>
          <h1>Latest Posts</h1>
          <p class="text-muted">Read what the community is writing</p>
        </div>
        <button class="btn btn-primary" id="btn-new-post" style="display:none" onclick="showView('write')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Post
        </button>
      </div>
      <div id="posts-list" class="posts-list"></div>
      <div id="feed-empty" class="empty-state" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <p>No posts yet. Be the first to write one!</p>
      </div>
      <div id="feed-loading" class="loading"><div class="spinner"></div></div>
    </div>

    <!-- WRITE / EDIT POST VIEW -->
    <div id="view-write" class="view" style="display:none">
      <div class="write-card">
        <h2 id="write-title">Create New Post</h2>
        <form id="post-form">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="post-title" placeholder="An interesting title..." maxlength="200"/>
          </div>
          <div class="form-group">
            <label>Content</label>
            <textarea id="post-content" rows="10" placeholder="Write your thoughts..."></textarea>
          </div>
          <div class="write-actions">
            <button type="button" class="btn btn-ghost" onclick="showView('feed')">Cancel</button>
            <button type="submit" class="btn btn-primary" id="post-submit">Publish</button>
          </div>
        </form>
      </div>
    </div>

    <!-- SINGLE POST VIEW -->
    <div id="view-post" class="view" style="display:none">
      <button class="btn btn-ghost btn-back" onclick="showView('feed')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Feed
      </button>
      <article class="post-detail" id="post-detail"></article>
      <section class="comments-section" id="comments-section"></section>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
